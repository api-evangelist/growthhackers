description: >-
  GrowthHackers (Growth Hackers Company, LLC) is a growth-marketing community and
  software company built around the growth-hacking discipline Sean Ellis named. It runs
  an invite-only community for founders, heads of growth, marketers and product managers,
  publishes growth research, case studies, opinion pieces and the State of Growth survey,
  and hosts webinars, AMAs and a conference. Alongside the community it sells growth and
  AI marketing services and ships Growth OS, an AI-powered growth and optimization
  platform for agencies that combines experiment planning, content creation, digital
  marketing execution and reporting. GrowthHackers publishes no public API, developer
  portal, SDK or machine-readable specification.

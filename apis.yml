  detail: >-
    GrowthHackers ships end-user software only — the Growth OS platform at
    os.growthhackers.com and the community app at community.growthhackers.com are React
    SPAs on a private Supabase backend, with no developer portal, reference, spec, SDK or
    access-request form anywhere on the estate; the Growth OS terms of service reserve
    "our approved APIs" but nothing is published to approve against, and
    api.growthhackers.com is a dangling DNS record that Cloudflare refuses to proxy
    (error 1000, "DNS points to prohibited IP").
